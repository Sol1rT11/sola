<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sola</title>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin><link rel="dns-prefetch" href="https://api.cloudinary.com"><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#140a17"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#140a17;--sf:#261629;--or:#ff7a3d;--pk:#ff3d8b;--go:#ffcf5c;--sk:#7cc6ff;--tx:#fff4ee;--mu:#b9a3b5;color-scheme:dark;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Onest,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
html[data-wide] body{background:radial-gradient(90% 60% at 50% 100%,#3a1540,#0c060e)}
html[data-wide] #app{left:50%;right:auto;width:min(460px,100vw);transform:translateX(-50%);box-shadow:0 0 0 1px #ffffff1f,0 24px 90px #000c}
.snap{position:absolute;left:calc(50% - 140px);top:18px;width:48px;height:48px;border-radius:50%;background:#0008;font-size:22px}
.cam .chips{touch-action:pan-x}
.card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 110px 6px color-mix(in srgb,var(--au,#ff7a3d) 42%,transparent)}
.side,.meta,.pbar,.pz{z-index:2}
.gh .ava::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--go),var(--or),var(--pk),var(--go));animation:spin 4s linear infinite}
.ava .av{position:relative}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--mu);line-height:1.4}.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--or);flex:none}.chk a{color:var(--go);font-weight:600}
.dis{font-family:Unbounded,system-ui,sans-serif}
/* splash + gate */
#splash,#gate{position:absolute;inset:0;z-index:60;background:radial-gradient(120% 70% at 50% 100%,#5a1a3a,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;transition:opacity .6s}
#gate{z-index:55;display:none;overflow-y:auto;justify-content:flex-start;padding-top:calc(var(--st) + 90px)}
#splash.off{opacity:0;pointer-events:none}
.sun{position:absolute;left:50%;bottom:-160px;width:320px;height:320px;margin-left:-160px;border-radius:50%;background:radial-gradient(circle,#fff3c4,var(--go) 35%,var(--or) 60%,var(--pk));box-shadow:0 0 120px 40px #ff7a3d66;animation:rise 2.4s cubic-bezier(.2,.9,.3,1) forwards}
.sun::before{content:"";position:absolute;inset:-90px;border-radius:50%;background:repeating-conic-gradient(#ffcf5c33 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,transparent 45%,#000 46%,transparent 72%);mask:radial-gradient(circle,transparent 45%,#000 46%,transparent 72%);animation:spin 24s linear infinite}
@keyframes rise{to{transform:translateY(-52vh)}}
@keyframes spin{to{transform:rotate(360deg)}}
.word{position:relative;display:flex;font:800 clamp(52px,20vw,88px)/1 Unbounded,sans-serif;letter-spacing:-.04em}
.word span{display:inline-block;opacity:0;transform:translateY(70%);animation:lt .7s cubic-bezier(.2,1.3,.3,1) forwards}
@keyframes lt{to{opacity:1;transform:none}}
#gate h2{font:800 26px/1.1 Unbounded,sans-serif;position:relative}
#gate p,#gate .f{position:relative;max-width:330px;line-height:1.45;opacity:.9}
#gate .f{width:100%;display:flex;flex-direction:column;gap:10px}
/* logo/top */
.logo{font:800 20px Unbounded,sans-serif;letter-spacing:-.03em;background:linear-gradient(90deg,var(--go),var(--or),var(--pk),var(--go));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:300% 0}}
#top{position:absolute;z-index:8;left:0;right:0;top:0;padding:calc(var(--st) + 12px) 14px 0;display:none;align-items:center;justify-content:center;pointer-events:none}
[data-v=home] #top{display:flex}
#tabs{display:flex;gap:16px;pointer-events:auto}
#tabs button{font-weight:600;font-size:14px;color:#fff9;position:relative;padding:4px 0;transition:color .2s}
#tabs button.a{color:#fff}
#tabs button.a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--or),var(--pk));animation:grow .3s}
@keyframes grow{from{transform:scaleX(0)}}
#mute{position:absolute;right:10px;top:calc(var(--st) + 8px);pointer-events:auto;width:34px;height:34px;border-radius:50%;background:#140a17aa;font-size:16px}#newp{display:none;position:absolute;top:calc(var(--st) + 52px);left:50%;transform:translateX(-50%);pointer-events:auto;padding:7px 16px;border-radius:99px;background:linear-gradient(120deg,var(--or),var(--pk));font-size:13px;font-weight:600;animation:dn .4s}@keyframes dn{from{opacity:0;transform:translate(-50%,-14px)}}
/* feed */
.fd{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:var(--bg)}
.fd::-webkit-scrollbar{display:none}
#home{position:absolute;inset:0}
[data-v=page] #home{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;contain:layout paint}
.vw{position:absolute;inset:0;container-type:size;background:linear-gradient(110deg,#261629 30%,#3a2040 50%,#261629 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.vw video,.vw .mi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.vw.ld{animation:none;background:#000}
.vw.ct video,.vw.ct .mi{object-fit:contain}
.tx{position:absolute;transform:translate(-50%,-50%);font-weight:800;text-shadow:0 2px 10px #0009;white-space:pre-wrap;text-align:center;max-width:90%;line-height:1.1;touch-action:none}
.on .tx{animation:txin .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes txin{from{opacity:0;scale:.4}}
.fx1::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px 30px #000c;pointer-events:none}
.fx2::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,#0004 2px 4px);pointer-events:none}
.fx3 video,.fx3 .mi{animation:gl 2.4s steps(1) infinite}
@keyframes gl{0%,92%{transform:none}93%{transform:translateX(-2%) skewX(3deg);filter:hue-rotate(90deg)}96%{transform:translateX(2%)}}
.fx4 video,.fx4 .mi{animation:pu .8s ease-in-out infinite alternate}
@keyframes pu{to{transform:scale(1.06)}}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,#140a17ee);pointer-events:none}
.pbar{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 58px);height:3px;background:#fff2}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--go),var(--or),var(--pk));transform-origin:left;transform:scaleX(0)}
.side{position:absolute;right:10px;bottom:calc(var(--sb) + 130px);display:flex;flex-direction:column;gap:15px;align-items:center}
.b{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;opacity:0;transform:translateX(30px) scale(.6)}
.on .b,.on .ava{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.on .b:nth-child(2){animation-delay:.06s}.on .b:nth-child(3){animation-delay:.12s}.on .b:nth-child(4){animation-delay:.18s}.on .b:nth-child(5){animation-delay:.24s}
@keyframes pop{to{opacity:1;transform:none}}
.b svg{width:33px;height:33px;fill:#fff;transition:transform .2s}
.b:active svg{transform:scale(.78)}
.b.is svg{fill:var(--go);animation:beat .5s}
[data-a=save].is svg{fill:var(--go)}
@keyframes beat{40%{transform:scale(1.45) rotate(-12deg)}}
.ava{position:relative;opacity:0;margin-bottom:8px;cursor:pointer}
.ava em{position:absolute;left:50%;bottom:-9px;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:var(--pk);display:grid;place-items:center;font:700 15px/1 Onest;font-style:normal}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:800;font-family:Unbounded,sans-serif;color:#140a17;flex:none;border:2px solid #fff}
.meta{position:absolute;left:14px;right:80px;bottom:calc(var(--sb) + 72px)}
.meta b{font:500 14px Unbounded,sans-serif;cursor:pointer}
.meta p{margin-top:6px;font-size:15px;line-height:1.35;word-break:break-word}
.meta a{color:var(--go);font-weight:600}
.meta>*{opacity:0;transform:translateY(14px)}
.on .meta>*{animation:rs .6s .08s ease forwards}.on .meta p{animation-delay:.2s}.on .mus{animation-delay:.3s}
@keyframes rs{to{opacity:1;filter:none;transform:none}}
.mus{margin-top:8px;font-size:13px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.mus span{display:inline-block;animation:mq 9s linear infinite;padding-right:40px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.crown{font:700 10px Onest;font-style:normal;margin-left:6px;padding:2px 7px;border-radius:99px;background:linear-gradient(120deg,var(--go),var(--or));color:#2a1200;vertical-align:middle;letter-spacing:.02em}
.hot{display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#ff3d8b33;border:1px solid var(--pk);margin-bottom:8px}
.hot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pk);animation:pl 1.2s infinite}
@keyframes pl{50%{transform:scale(1.8);opacity:.4}}
.disc{display:none!important;position:absolute;right:14px;bottom:calc(var(--sb) + 70px);width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--go),var(--or),var(--pk),var(--go));border:9px solid var(--bg);box-shadow:0 0 0 2px #fff4;animation:spin 3s linear infinite paused}
.on:not(.paused) .disc{animation-play-state:running}
.pz{position:absolute;inset:0;margin:auto;width:80px;height:80px;border-radius:50%;background:#140a17cc;display:grid;place-items:center;font-size:28px;opacity:0;transform:scale(.5);transition:.25s;pointer-events:none}
.paused .pz{opacity:1;transform:none}
.gone{display:none}
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:4}
.burst svg{position:absolute;width:110px;height:110px;left:-55px;top:-55px;fill:var(--go);filter:drop-shadow(0 0 18px var(--or));animation:big .9s ease-out forwards}
@keyframes big{0%{transform:scale(0) rotate(-20deg)}30%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1.5) translateY(-40px);opacity:0}}
.burst s{position:absolute;width:5px;height:26px;left:-2px;top:-13px;border-radius:5px;background:var(--c);animation:ray .8s ease-out forwards}
@keyframes ray{from{transform:rotate(var(--a)) translateY(-30px)}to{transform:rotate(var(--a)) translateY(-110px) scaleY(.2);opacity:0}}
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:12px}
#empty h2{font:800 26px/1.1 Unbounded,sans-serif}#empty p{opacity:.85;max-width:290px;line-height:1.45}
.cta{padding:14px 26px;border-radius:99px;background:linear-gradient(120deg,var(--or),var(--pk));color:#fff;font-weight:600;font-size:16px;transition:transform .2s}
.cta:active{transform:scale(.94)}.cta[disabled]{opacity:.5}
.ghost{padding:10px 18px;border-radius:12px;background:#ffffff1a;font-weight:600;font-size:14px}
/* nav */
#nav{position:absolute;z-index:9;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(var(--sb) + 6px);background:#140a17f2}
#nav button{font-size:12px;font-weight:600;color:var(--mu);padding:9px 8px;position:relative;transition:color .2s}
#nav button.a{color:var(--tx)}
#nav .plus{width:54px;height:38px;border-radius:13px;background:linear-gradient(120deg,var(--go),var(--or),var(--pk));background-size:200% 100%;color:#2a1200;font-size:26px;line-height:1;padding:0;animation:flow 4s linear infinite;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#nav .plus:active{transform:scale(.85) rotate(90deg)}
#nav i{position:absolute;top:4px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--pk);display:none}
/* pages */
#page{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--st) + 14px) 14px 90px;display:none}
[data-v=page] #page{display:block}
.pg{animation:rs .4s ease both}
.sbar input,.in{width:100%;font-size:16px;background:#ffffff14;border:2px solid transparent;border-radius:14px;padding:13px 14px;outline:0}
.sbar input:focus,.in:focus{border-color:var(--or)}
.tabs2{display:flex;gap:8px;margin:12px 0}
.tabs2 button{padding:8px 14px;border-radius:99px;background:#ffffff14;font-size:13px;font-weight:600}
.tabs2 button.a{background:var(--tx);color:var(--bg)}
h4{font:500 15px Unbounded,sans-serif;margin:18px 0 10px}
.urow{display:flex;align-items:center;gap:12px;padding:8px 0}
.urow>div{flex:1;min-width:0}.urow b{display:block;font-size:15px}.urow small{color:var(--mu)}
.fbtn{padding:8px 16px;border-radius:10px;background:var(--or);color:#2a1200;font-weight:700;font-size:13px}
.fbtn.on2{background:#ffffff1f;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gi{aspect-ratio:9/14;border-radius:10px;overflow:hidden;background:#ffffff14;position:relative}
.gi video,.gi img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.gi span{position:absolute;left:6px;bottom:5px;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000}
.ph{text-align:center;padding-top:6px}
.ph .av{margin:0 auto;border:3px solid var(--or)}
.ph h3{font:800 20px Unbounded,sans-serif;margin-top:12px}.ph small{color:var(--mu)}
.ph p{margin:10px auto;max-width:300px;line-height:1.4}
.cnt{display:flex;justify-content:center;gap:22px;margin:14px 0}
.cnt button{text-align:center;color:var(--mu);font-size:12px}.cnt b{display:block;color:var(--tx);font:500 18px Unbounded,sans-serif}
.note{text-align:center;color:var(--mu);padding:34px 10px;line-height:1.5}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:14px;line-height:1.35}
.ev small{color:var(--mu);display:block}
/* overlays */
#ov,#sh{position:absolute;inset:0;display:none}
#ov{z-index:30;background:var(--bg)}#sh{z-index:40;background:#140a17b0}
#ov.show,#sh.show{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78dvh;display:flex;flex-direction:column;gap:12px;padding:18px 16px calc(var(--sb) + 16px);background:var(--sf);border-radius:26px 26px 0 0;animation:up .4s cubic-bezier(.2,1.1,.3,1);overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font:500 16px Unbounded,sans-serif}
.row{display:flex;gap:8px;align-items:center}
.cm{display:flex;gap:10px;font-size:14px;line-height:1.35;animation:pop .3s both}.cm b{font-size:13px;color:var(--go)}
.cm small{color:var(--mu);margin-left:6px}.cm>div{flex:1;min-width:0;word-break:break-word}.cm button{color:var(--mu);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw button.a{border-color:#fff}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big2 button{padding:26px 10px;border-radius:20px;background:#ffffff14;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .2s}.big2 button:active{transform:scale(.94)}.big2 b{font-size:30px}
.player{position:absolute;inset:0}.player>button{position:absolute;z-index:6;left:12px;top:calc(var(--st) + 10px);width:40px;height:40px;border-radius:50%;background:#140a17aa;font-size:20px}
/* camera + editor */
.cam{position:absolute;inset:0;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctop{position:absolute;top:calc(var(--st) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.ctop button{padding:7px 10px;border-radius:99px;background:#0008;font-size:12px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px}
.chips button{flex:none;padding:8px 14px;border-radius:99px;background:#ffffff1f;font-size:13px;font-weight:600;transition:.2s}
.chips button.a{background:var(--tx);color:var(--bg);transform:scale(1.06)}
.cam .chips{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 130px);z-index:2}
.rec{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 28px);display:flex;justify-content:center;z-index:2}
#rb{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--pk) var(--p,0%),#ffffff55 0);display:grid;place-items:center}
#rb i{width:68px;height:68px;border-radius:50%;background:var(--pk);border:4px solid #000;transition:.25s}
#rb.r i{width:34px;height:34px;border-radius:10px}
.cd{position:absolute;inset:0;display:grid;place-items:center;font:800 120px Unbounded,sans-serif;z-index:3;pointer-events:none}
.cd span{animation:cdp 1s both}@keyframes cdp{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.6);opacity:0}}
.ed{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
.eh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.eh button:first-child{font-size:22px;padding:4px 10px}
.pvw{flex:1;min-height:0;display:flex;justify-content:center;padding:0 12px}
.pv{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;background:#000}
.ep{padding:10px 12px calc(var(--sb) + 12px);display:flex;flex-direction:column;gap:10px;height:34dvh;overflow-y:auto}
.et{display:flex;gap:6px}.et button{flex:1;padding:9px 2px;border-radius:10px;background:#ffffff14;font-size:13px;font-weight:600}.et button.a{background:var(--tx);color:var(--bg)}
.ep label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
input[type=range]{accent-color:var(--or);width:100%}
.tg{position:absolute;left:50%;top:calc(var(--st) + 70px);z-index:70;transform:translate(-50%,-30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
.tg.s{opacity:1;transform:translate(-50%,0)}
.big2 label{padding:26px 10px;border-radius:20px;background:#ffffff14;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;transition:transform .2s}.big2 label:active{transform:scale(.94)}.big2 label b{font-size:30px}
label.ghost,label.cta{cursor:pointer;display:inline-block;text-align:center}
.meta a,.cm a{color:var(--go);font-weight:600}.meta a.m,.cm a.m{color:var(--sk)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg div{background:#ffffff12;border-radius:14px;padding:10px 4px;text-align:center}.sg b{display:block;font:500 16px Unbounded,sans-serif}.sg small{color:var(--mu);font-size:11px}
.bars{display:flex;align-items:flex-end;gap:4px;height:56px;margin-top:6px}.bars i{flex:1;background:linear-gradient(var(--or),var(--pk));border-radius:4px 4px 0 0}
.meter{height:10px;border-radius:99px;background:#ffffff1a;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--go),var(--or),var(--pk))}
.sheet small{color:var(--mu);line-height:1.4}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

.crown.ck{background:var(--sk);color:#06223a}.crown.pr{background:linear-gradient(120deg,#9b7bff,var(--pk));color:#fff}
.pill{padding:5px 11px;border-radius:99px;background:#ffffff1a;font-size:12px;font-weight:600}
.tgl{display:flex;gap:12px;align-items:center;justify-content:space-between}.tgl>div{flex:1}.tgl b{display:block;font-size:14px}
